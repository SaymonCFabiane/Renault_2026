<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TracePro</title>
<meta name="description" content="Protótipo navegável do TracePro">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
:root{--pg-bg:#E9F1F5;--pg-ink:#1E2F38;--pg-muted:#5B6B75;--pg-bar:#F6FAFD;--pg-line:#C9D8E0;--pg-accent:#265267;--pg-on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg-bg:#0E1A20;--pg-ink:#EEF3F6;--pg-muted:#A9BAC3;--pg-bar:#15252D;--pg-line:#2A3E48;--pg-accent:#8DBBD0;--pg-on:#10222B;color-scheme:dark}}
:root[data-theme="dark"]{--pg-bg:#0E1A20;--pg-ink:#EEF3F6;--pg-muted:#A9BAC3;--pg-bar:#15252D;--pg-line:#2A3E48;--pg-accent:#8DBBD0;--pg-on:#10222B;color-scheme:dark}
body{background:var(--pg-bg);color:var(--pg-ink);font-family:"Nunito",ui-rounded,system-ui,sans-serif;margin:0}
#app{min-height:100vh;display:flex;flex-direction:column}
.pres{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:var(--pg-bar);border-bottom:1px solid var(--pg-line)}
.pres__brand{display:flex;flex-direction:column;line-height:18px;margin-right:auto}
.pres__brand b{font-size:16px;color:var(--pg-accent)}
.pres__brand span{font-size:12px;color:var(--pg-muted)}
.pres__seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--pg-line);gap:2px}
.pres__seg button,.pres__act button{font:inherit;font-weight:700;font-size:13px;border:0;cursor:pointer;height:32px;padding:0 14px;border-radius:999px;background:transparent;color:var(--pg-ink)}
.pres__seg button.on{background:var(--pg-accent);color:var(--pg-on)}
.pres__act{display:flex;gap:8px;flex-wrap:wrap}
.pres__act button{border:1.5px solid var(--pg-line)}
.pres__act button:hover,.pres__seg button:not(.on):hover{background:var(--pg-line)}
.pres__where{padding:10px 16px 0;font-size:12px;font-weight:700;color:var(--pg-muted);letter-spacing:.03em}
.stage{padding:12px 16px 32px;display:flex;justify-content:center;min-width:0}
.frame{overflow:hidden;border-radius:14px;box-shadow:0 10px 40px #0b1a2226;flex:none}
.frame--mob{border-radius:0;box-shadow:none;overflow:visible}
.frame--web>.tp{border-radius:14px;overflow:hidden}
button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:2px}

.tp{--primary:#265267;--on-primary:#ffffff;--primary-soft:#BCD2DD;--sidebar:#265267;--content-bg:#C8E1ED;--surface:#F6FAFD;--surface-muted:#D4E0E7;--text:#1E2F38;--text-secondary:#5B6B75;--line:#D4E0E7;--data:#547C90;--data-light:#B7CCD6;--accent:#C2703D;--accent-text:#9E5528;--accent-bg:#F5DED1;--success:#2F7A5B;--success-bg:#E3F5EE;--warning:#E0A526;--warning-text:#7A5200;--warning-bg:#FFF4D6;--danger:#C0392B;--danger-bg:#FBE4E1;--on-status:#ffffff;--font-sans:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;--radius-icon:8px;--radius-card:12px;--radius-pill:999px;color-scheme:light}
.tp[data-theme="dark"]{--primary:#8DBBD0;--on-primary:#10222B;--primary-soft:#2C4F60;--sidebar:#2E6078;--content-bg:#193A4A;--surface:#121212;--surface-muted:#2A3E48;--text:#EEF3F6;--text-secondary:#A9BAC3;--line:#2F4450;--data:#6E97AB;--data-light:#B7CCD6;--accent:#D98A57;--accent-text:#E9A277;--accent-bg:#3A2518;--success:#5CC096;--success-bg:#15302A;--warning:#E0A526;--warning-text:#F0C35A;--warning-bg:#3A2E10;--danger:#EF6B5D;--danger-bg:#3D1A16;--on-status:#121212;color-scheme:dark}

/* TracePro — componentes base. Lê só tokens (var(--…)); web e mobile usam as mesmas classes. */
.tp, .tp *{box-sizing:border-box}
.tp{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--text);-webkit-font-smoothing:antialiased}
:where(.tp) button{font:inherit;color:inherit}
.tp :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tp svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tp .num{font-variant-numeric:tabular-nums}

/* Tipografia */
.tp-h1{font-size:28px;line-height:36px;font-weight:700;margin:0;color:var(--text);text-wrap:balance}
.tp-h2{font-size:20px;line-height:28px;font-weight:600;margin:0;color:var(--text)}
.tp-h3{font-size:16px;line-height:24px;font-weight:600;margin:0;color:var(--text)}
.tp-cap{font-size:12px;line-height:16px;color:var(--text-secondary)}
.tp-muted{color:var(--text-secondary)}

/* Botões — sempre pílula */
.tp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:var(--radius-pill);border:1.5px solid transparent;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:filter .15s,background .15s}
.tp-btn:hover{filter:brightness(1.06)}
.tp-btn:active{filter:brightness(.94)}
.tp-btn--primary{background:var(--primary);color:var(--on-primary)}
.tp-btn--secondary{background:var(--primary-soft);color:var(--text)}
.tp-btn--outline{background:var(--surface);color:var(--text);border-color:var(--primary)}
.tp-btn--ghost{background:transparent;color:var(--primary)}
.tp-btn--success{background:var(--success);color:var(--on-status)}
.tp-btn--danger{background:var(--danger);color:var(--on-status)}
.tp-btn--accent{background:var(--accent);color:var(--on-status)}
.tp-btn--sm{height:32px;padding:0 14px;font-size:13px}
.tp-btn--lg{height:52px;padding:0 24px;font-size:16px}
.tp-btn--block{width:100%}
.tp-btn[disabled],.tp-btn.is-disabled{opacity:.45;cursor:not-allowed;filter:none}
.tp-icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--radius-pill);border:0;background:transparent;color:var(--text);cursor:pointer;position:relative}
.tp-icon-btn:hover{background:var(--surface-muted)}

/* Campos */
.tp-label{display:block;font-size:12px;line-height:16px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.02em}
.tp-input,.tp-select{width:100%;height:40px;padding:0 14px;border-radius:var(--radius-icon);border:1.5px solid transparent;background:var(--surface-muted);color:var(--text);font:inherit}
.tp-input::placeholder{color:var(--text-secondary)}
.tp-input:focus,.tp-select:focus{outline:none;border-color:var(--primary)}
textarea.tp-input{height:auto;padding:10px 14px;resize:vertical}
.tp-select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-secondary) 50%),linear-gradient(135deg,var(--text-secondary) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.tp-select--pill{border-radius:var(--radius-pill);background-color:var(--surface);border-color:var(--text-secondary)}
.tp-search{display:flex;align-items:center;height:40px;border:1.5px solid var(--text);border-radius:var(--radius-pill);overflow:hidden;background:var(--surface);min-width:0}
.tp-search input{flex:1;min-width:0;border:0;background:transparent;padding:0 18px;font:inherit;color:var(--text);height:100%}
.tp-search input:focus{outline:none}
.tp-search input::placeholder{color:var(--text-secondary)}
.tp-search button{height:100%;width:52px;border:0;background:var(--surface-muted);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.tp-date{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:1.5px solid var(--text-secondary);border-radius:var(--radius-pill);background:var(--surface);font-weight:600;color:var(--text)}
.tp-date svg.i{color:var(--primary)}

/* Toggle de tema e sino */
.tp-theme{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:var(--radius-pill);background:var(--surface-muted);border:0;cursor:pointer}
.tp-theme span{display:grid;place-items:center;width:32px;height:24px;border-radius:var(--radius-pill);color:var(--text-secondary)}
.tp-theme span.on{background:var(--primary);color:var(--on-primary)}
.tp-theme svg.i{width:14px;height:14px}
.tp-bell .dot{position:absolute;top:-2px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--radius-pill);background:var(--danger);color:#fff;font-size:10px;line-height:16px;font-weight:800;text-align:center;border:2px solid var(--surface)}

/* Avatar */
.tp-avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:800;flex:none;letter-spacing:.02em}
.tp-avatar--lg{width:76px;height:76px;font-size:24px;box-shadow:0 0 0 4px var(--sidebar),0 0 0 7px var(--primary-soft)}

/* Cards */
.tp-card{background:var(--surface);border-radius:var(--radius-card);padding:20px}
.tp-card__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}

/* KPI */
.tp-iconbox{display:grid;place-items:center;width:48px;height:48px;border-radius:var(--radius-icon);background:var(--success-bg);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 25%,transparent);flex:none}
.tp-iconbox svg.i{width:22px;height:22px}
.tp-iconbox--data{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.tp-iconbox--accent{background:var(--accent-bg);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.tp-iconbox--danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.tp-iconbox--warning{background:var(--warning-bg);color:var(--warning-text);border-color:transparent}
.tp-kpi{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius-card);border:1.5px solid color-mix(in srgb,var(--success) 35%,var(--surface-muted));background:var(--surface)}
.tp-kpi__num{font-size:28px;line-height:34px;font-weight:700;font-variant-numeric:tabular-nums}
.tp-kpi__label{color:var(--text-secondary);font-weight:600}
.tp-kpi--alert{border-color:var(--accent);background:var(--accent-bg)}
.tp-kpi--alert .tp-kpi__label{color:var(--text)}
.tp-kpi__info{position:absolute;right:-8px;bottom:-8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent);border:1.5px solid var(--accent)}
.tp-kpi__info svg.i{width:12px;height:12px}

/* Tabela */
.tp-table-wrap{overflow-x:auto}
.tp-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tp-table th{background:var(--surface-muted);text-align:left;font-weight:600;padding:12px 16px;white-space:nowrap;color:var(--text)}
.tp-table th:first-child{border-radius:var(--radius-icon) 0 0 var(--radius-icon)}
.tp-table th:last-child{border-radius:0 var(--radius-icon) var(--radius-icon) 0}
.tp-table th .sort{display:inline-flex;vertical-align:middle;margin-left:6px;color:var(--text-secondary)}
.tp-table th .sort svg.i{width:14px;height:14px}
.tp-table td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tp-table tr:last-child td{border-bottom:0}
.tp-table tr.is-clickable{cursor:pointer}
.tp-table tr.is-clickable:hover td,.tp-table tr.is-selected td{background:color-mix(in srgb,var(--primary-soft) 45%,transparent)}
.tp-table tr.is-warn td{background:var(--warning-bg)}
.tp-table tr.is-bad td{background:var(--danger-bg)}

/* Status em texto colorido (sem badge) */
.tp-status{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tp-status--ok{color:var(--success)}
.tp-status--bad{color:var(--danger)}
.tp-status--warn{color:var(--warning-text)}
.tp-status--info{color:var(--primary)}
.tp-status--muted{color:var(--text-secondary)}
.tp-status--accent{color:var(--accent-text)}

/* Tags de criticidade */
.tp-tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-pill);font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.tp-tag svg.i{width:12px;height:12px;stroke-width:2.5}
.tp-tag--blocante{background:var(--danger-bg);color:var(--danger)}
.tp-tag--nao{background:var(--surface-muted);color:var(--text-secondary)}
.tp-tag--info{background:var(--primary-soft);color:var(--primary)}
.tp-tag--accent{background:var(--accent-bg);color:var(--accent-text)}
.tp-tag--ok{background:var(--success-bg);color:var(--success)}
.tp-tag--warn{background:var(--warning-bg);color:var(--warning-text)}

/* Abas */
.tp-tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);overflow-x:auto}
.tp-tab{background:none;border:0;padding:8px 2px 10px;font-weight:600;font-size:15px;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tp-tab.on{color:var(--accent-text);border-bottom-color:var(--accent)}
.tp-tab .count{display:inline-block;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:var(--radius-pill);background:var(--surface-muted);font-size:11px;line-height:20px;color:var(--text)}

/* Paginação */
.tp-pages{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:13px}
.tp-pages button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--text)}
.tp-pages button.on{background:var(--primary);color:var(--on-primary)}
.tp-pages button.arrow{border:1.5px solid var(--primary);color:var(--primary);display:grid;place-items:center}
.tp-pages button.arrow svg.i{width:14px;height:14px}

/* Chave, checkbox, segmento */
.tp-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:700;font-size:12px}
.tp-switch input{position:absolute;opacity:0;pointer-events:none}
.tp-switch .track{width:36px;height:20px;border-radius:var(--radius-pill);background:var(--surface-muted);position:relative;transition:background .15s;flex:none}
.tp-switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0003;transition:left .15s}
.tp-switch input:checked+.track{background:var(--danger)}
.tp-switch input:checked+.track::after{left:18px}
.tp-switch input:focus-visible+.track{outline:2px solid var(--primary);outline-offset:2px}
.tp-check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tp-check input{width:18px;height:18px;accent-color:var(--primary);margin:1px 0 0;flex:none}
.tp-seg{display:inline-flex;padding:3px;border-radius:var(--radius-pill);background:var(--surface-muted);gap:2px}
.tp-seg button{border:0;background:transparent;height:30px;padding:0 14px;border-radius:var(--radius-pill);font-weight:700;font-size:13px;cursor:pointer;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px}
.tp-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0002}
.tp-seg--prio button.on[data-v="Alta"]{background:var(--danger);color:#fff}
.tp-seg--prio button.on[data-v="Média"]{background:var(--warning);color:#1E2F38}
.tp-seg--prio button.on[data-v="Baixa"]{background:var(--primary);color:var(--on-primary)}

/* Banners, toasts, modais */
.tp-banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius-card);border:1.5px solid;font-weight:600}
.tp-banner svg.i{margin-top:1px}
.tp-banner--ok{background:var(--success-bg);color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent)}
.tp-banner--warn{background:var(--warning-bg);color:var(--warning-text);border-color:var(--warning)}
.tp-banner--bad{background:var(--danger-bg);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.tp-banner--info{background:var(--primary-soft);color:var(--text);border-color:transparent}
.tp-banner b{color:inherit}
.tp-banner p{margin:2px 0 0;font-weight:500;color:var(--text)}
.tp-toasts{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;max-width:calc(100% - 40px)}
.tp-toast{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--radius-card);background:var(--text);color:var(--surface);font-weight:600;box-shadow:0 8px 24px #0003;animation:tp-in .25s ease-out;max-width:380px}
.tp-toast .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.tp-toast--ok .ico{background:var(--success);color:#fff}
.tp-toast--bad .ico{background:var(--danger);color:#fff}
.tp-toast--warn .ico{background:var(--warning);color:#1E2F38}
.tp-toast .ico svg.i{width:15px;height:15px}
@keyframes tp-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.tp-backdrop{position:absolute;inset:0;background:#0b1a2266;display:grid;place-items:center;z-index:50;padding:20px;animation:tp-fade .15s}
@keyframes tp-fade{from{opacity:0}}
.tp-modal{background:var(--surface);border-radius:var(--radius-card);padding:24px;width:min(440px,100%);box-shadow:0 20px 50px #0004;display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.tp-modal__icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.tp-modal__icon svg.i{width:26px;height:26px}
.tp-modal__actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.tp-progress{height:8px;border-radius:var(--radius-pill);background:var(--surface-muted);overflow:hidden}
.tp-progress>i{display:block;height:100%;border-radius:inherit;background:var(--data);transition:width .3s}
.tp-progress--ok>i{background:var(--success)}

/* Vazio / bloqueado */
.tp-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 16px;color:var(--text-secondary)}
.tp-empty .ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface-muted);color:var(--text-secondary)}
.tp-empty b{color:var(--text);font-size:15px}
.tp-locked{opacity:.55}

/* Visor de câmera (leitura de QR simulada) */
.tp-scanner{position:relative;background:#0d1a20;border-radius:var(--radius-card);aspect-ratio:4/3;max-width:100%;overflow:hidden;display:grid;place-items:center;color:#cfe3ec}
.tp-scanner::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#23404d 0,#0d1a20 70%)}
.tp-scanner__frame{position:relative;width:58%;aspect-ratio:1;border-radius:14px;--c:#e9f3f7}
.tp-scanner__frame i{position:absolute;width:26px;height:26px;border:4px solid var(--c)}
.tp-scanner__frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.tp-scanner__frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.tp-scanner__frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.tp-scanner__frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.tp-scanner__laser{position:absolute;left:8%;right:8%;height:2px;background:var(--c);box-shadow:0 0 12px var(--c);animation:tp-laser 1.8s ease-in-out infinite alternate;top:10%}
@keyframes tp-laser{to{top:88%}}
.tp-scanner__qr{position:absolute;inset:22%;opacity:.18;color:#fff}
.tp-scanner__qr svg{width:100%;height:100%}
.tp-scanner__msg{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;justify-content:center;padding:8px 12px;border-radius:var(--radius-pill);background:#0008;font-weight:700;font-size:14px;text-align:center}
.tp-scanner__beep{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:var(--radius-pill);background:#0006}
.tp-scanner.is-ok .tp-scanner__frame{--c:#4fd39a}
.tp-scanner.is-ok{box-shadow:inset 0 0 0 4px #4fd39a}
.tp-scanner.is-ok .tp-scanner__msg{background:#1f6b4c}
.tp-scanner.is-bad .tp-scanner__frame{--c:#ff6b5e}
.tp-scanner.is-bad{box-shadow:inset 0 0 0 4px #ff6b5e}
.tp-scanner.is-bad .tp-scanner__msg{background:#a3281c}
.tp-scanner.is-ok .tp-scanner__laser,.tp-scanner.is-bad .tp-scanner__laser{animation:none;opacity:0}

/* Leituras (histórico de bipagem) */
.tp-reads{display:flex;flex-direction:column;gap:8px}
.tp-read{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-icon);background:var(--surface);border:1.5px solid var(--line)}
.tp-read .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.tp-read--ok .ico{background:var(--success-bg);color:var(--success)}
.tp-read--bad{border-color:var(--danger);background:var(--danger-bg)}
.tp-read--bad .ico{background:var(--danger);color:#fff}
.tp-read .code{font-weight:800;font-variant-numeric:tabular-nums}
.tp-read .when{margin-left:auto;font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}

/* Etiqueta de peça */
.tp-label-card{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:10px;border-radius:var(--radius-icon);background:#fff;color:#111;border:1.5px dashed #9aa9b1;font-size:11px;line-height:14px}
.tp-label-card .qr{width:64px;height:64px}
.tp-label-card b{font-size:13px;display:block}

/* Linha do tempo */
.tp-timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tp-timeline li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:22px}
.tp-timeline li:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--data-light)}
.tp-timeline .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.tp-timeline li.last .dot{background:var(--primary);color:var(--on-primary)}
.tp-timeline .when{font-size:12px;color:var(--text-secondary);font-weight:700;font-variant-numeric:tabular-nums}

/* Kanban */
.tp-kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:14px;overflow-x:auto;padding-bottom:4px}
.tp-kcol{background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:var(--radius-card);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:280px}
.tp-kcol__head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.tp-kcard{background:var(--surface);border-radius:var(--radius-icon);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:1.5px solid transparent;text-align:left;width:100%}
.tp-kcard:hover,.tp-kcard.on{border-color:var(--primary)}

/* Planta do galpão */
.tp-map{display:grid;gap:10px}
.tp-aisle{display:grid;grid-template-columns:120px repeat(8,1fr);gap:6px;align-items:center}
.tp-slot{height:30px;border-radius:6px;background:var(--surface-muted);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-secondary)}
.tp-slot.used{background:var(--data-light);color:var(--text)}
.tp-slot.hit{background:var(--primary);color:var(--on-primary)}
.tp-seq{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:12px;flex:none}

/* Gráficos (SVG) */
.tp-chart{display:block;width:100%;height:auto;overflow:visible}
.tp-chart text{fill:var(--text-secondary);font-size:11px;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.tp-chart .grid{stroke:var(--line);stroke-dasharray:4 4}
.tp-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--text-secondary)}
.tp-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tp-hbar{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:13px}
.tp-hbar .track{display:flex;align-items:center;gap:8px}
.tp-hbar .bar{height:12px;border-radius:var(--radius-pill);background:var(--data)}

/* Estrutura web */
.tp-app{display:grid;grid-template-columns:240px 1fr;height:100%;background:var(--content-bg);overflow:hidden;position:relative}
.tp-side{background:var(--sidebar);color:#fff;display:flex;flex-direction:column;padding:28px 0 20px 18px;min-height:0}
.tp-side__who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-right:18px;margin-bottom:28px}
.tp-side__who .name{font-weight:700;font-size:16px;margin-top:10px}
.tp-side__who .role{font-size:12px;opacity:.85}
.tp-side__who .mod{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px;border-radius:var(--radius-pill);background:#ffffff1f;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tp-side__who .mod svg.i{width:13px;height:13px}
.tp-nav{display:flex;flex-direction:column;gap:6px;flex:1}
.tp-nav button{position:relative;display:flex;align-items:center;gap:12px;height:46px;padding:0 18px;border:0;background:transparent;color:#fff;font-weight:600;font-size:15px;text-align:left;cursor:pointer;border-radius:var(--radius-pill) 0 0 var(--radius-pill)}
.tp-nav button:hover:not(.on){background:#ffffff14}
.tp-nav button.on{background:var(--content-bg);color:var(--text);font-weight:700}
.tp-nav button.on::before,.tp-nav button.on::after{content:"";position:absolute;right:0;width:24px;height:24px;pointer-events:none}
.tp-nav button.on::before{top:-24px;border-bottom-right-radius:24px;box-shadow:8px 8px 0 8px var(--content-bg)}
.tp-nav button.on::after{bottom:-24px;border-top-right-radius:24px;box-shadow:8px -8px 0 8px var(--content-bg)}
.tp-nav button.on svg.i{color:var(--primary)}
.tp-side__swap{display:flex;align-items:center;gap:10px;height:44px;margin-right:18px;padding:0 18px;border-radius:var(--radius-pill);border:1.5px solid #ffffff55;background:transparent;color:#fff;font-weight:700;cursor:pointer}
.tp-side__swap:hover{background:#ffffff14}
.tp-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tp-head{display:flex;align-items:center;gap:16px;padding:18px 30px;background:var(--surface)}
.tp-head .tp-search{width:360px;margin-left:auto}
.tp-content{flex:1;overflow:auto;padding:24px 30px 40px}
.tp-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.tp-stack{display:flex;flex-direction:column;gap:20px}
.tp-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tp-panel-title{display:flex;align-items:center;gap:10px;margin-bottom:4px}

/* Popover de notificações */
.tp-pop{position:absolute;top:64px;right:24px;width:360px;background:var(--surface);border-radius:var(--radius-card);box-shadow:0 16px 40px #0003;z-index:40;padding:8px;border:1px solid var(--line)}
.tp-pop h4{margin:8px 10px 6px;font-size:14px}
.tp-note{display:flex;gap:12px;padding:10px;border-radius:var(--radius-icon)}
.tp-note:hover{background:var(--surface-muted)}
.tp-note .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.tp-note p{margin:0;font-size:13px;line-height:18px}
.tp-note small{color:var(--text-secondary);font-size:11px}

/* Mobile */
.tp-phone{position:relative;width:390px;height:844px;max-width:100%;border-radius:44px;background:var(--content-bg);overflow:hidden;box-shadow:0 0 0 10px #10222b,0 30px 60px #0003;display:flex;flex-direction:column;font-size:16px;line-height:24px}
.tp-phone .tp-btn{height:52px;font-size:16px;padding:0 22px}
.tp-phone .tp-btn--sm{height:40px;font-size:14px;padding:0 16px}
.tp-m-status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:700;background:var(--sidebar);color:#fff}
.tp-m-head{background:var(--sidebar);color:#fff;padding:6px 20px 18px;flex:none;border-radius:0 0 24px 24px}
.tp-m-head__row{display:flex;align-items:center;gap:12px}
.tp-m-head .tp-avatar{width:44px;height:44px}
.tp-m-head .who{flex:1;min-width:0;line-height:20px}
.tp-m-head .who b{display:block;font-size:17px}
.tp-m-head .who span{font-size:13px;opacity:.85}
.tp-m-head .tp-icon-btn{color:#fff;width:48px;height:48px}
.tp-m-head .tp-icon-btn:hover{background:#ffffff1f}
.tp-m-head .tp-bell .dot{border-color:var(--sidebar)}

.tp-m-title{display:flex;align-items:center;gap:8px;margin-top:14px}
.tp-m-title h2{font-size:22px;line-height:28px;margin:0;font-weight:800}
.tp-m-back{width:40px;height:40px;border-radius:50%;border:0;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.tp-m-body{flex:1;overflow:auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.tp-m-body>*{flex-shrink:0}
.tp-m-body .tp-card{padding:16px}
.tp-m-nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 22px}
.tp-m-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border:0;background:transparent;color:var(--text-secondary);font-size:11px;font-weight:700;cursor:pointer;border-radius:var(--radius-icon);justify-content:center}
.tp-m-nav button svg.i{width:22px;height:22px}
.tp-m-nav button.on{color:var(--primary)}

.tp-fab{position:absolute;right:20px;bottom:104px;width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px #c2703d66;cursor:pointer;z-index:5}

.tp-bigcount{font-size:56px;line-height:60px;font-weight:800;font-variant-numeric:tabular-nums}

.tp-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-icon);background:var(--surface);border:1.5px solid var(--line)}
.tp-item.is-current{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.tp-item.is-done{background:var(--success-bg);border-color:transparent}
.tp-item.is-miss{background:var(--warning-bg);border-color:var(--warning)}
.tp-item .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-muted);color:var(--text-secondary)}
.tp-item.is-done .ico{background:var(--success);color:#fff}
.tp-item.is-current .ico{background:var(--primary);color:var(--on-primary)}
.tp-item.is-miss .ico{background:var(--warning);color:#1E2F38}
.tp-item .t{flex:1;min-width:0;line-height:20px}
.tp-item .t b{display:block;font-size:15px}
.tp-item .t span{font-size:13px;color:var(--text-secondary)}
.tp-lockscreen{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:14px;z-index:30}
.tp-lockscreen .big{width:96px;height:96px;border-radius:50%;background:#ffffff26;display:grid;place-items:center}
.tp-lockscreen .big svg.i{width:48px;height:48px}
.tp-photo{height:120px;border-radius:var(--radius-icon);border:2px dashed var(--text-secondary);display:grid;place-items:center;color:var(--text-secondary);background:var(--surface-muted);cursor:pointer}
.tp-thumb{width:84px;height:84px;border-radius:var(--radius-icon);background:linear-gradient(135deg,#8aa8b6,#547c90 60%,#3b5a69);display:grid;place-items:center;color:#fff}
@media (prefers-reduced-motion:reduce){.tp-scanner__laser{animation:none}.tp-toast,.tp-backdrop{animation:none}}
.tp-drawer{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--surface);box-shadow:-12px 0 32px #0002;z-index:30;display:flex;flex-direction:column;animation:tp-slide .2s ease-out}
@keyframes tp-slide{from{transform:translateX(30px);opacity:0}}
.tp-drawer__head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.tp-drawer__body{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.tp-stat{background:var(--surface-muted);border-radius:var(--radius-icon);padding:12px 14px}
.tp-stat b{display:block;font-size:24px;line-height:30px;font-variant-numeric:tabular-nums}

.tp-stat--warn{background:var(--warning-bg)}.tp-stat--warn b{color:var(--warning-text)}

.tp-link{background:none;border:0;padding:0;color:var(--primary);font-weight:700;text-decoration:underline;cursor:pointer;font:inherit}

function qr(seed, size=64){

  const finder=(x,y)=>`<rect x="${x*u}" y="${y*u}" width="${7*u}" height="${7*u}" fill="currentColor"/><rect x="${(x+1)*u}" y="${(y+1)*u}" width="${5*u}" height="${5*u}" fill="#fff"/><rect x="${(x+2)*u}" y="${(y+2)*u}" width="${3*u}" height="${3*u}" fill="currentColor"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) continue; if(rnd()>.52) r+=`<rect x="${x*u}" y="${y*u}" width="${u+.2}" height="${u+.2}"/>`; }
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="color:#111"><rect width="${size}" height="${size}" fill="#fff"/><g fill="currentColor">${r}</g>${finder(0,0)}${finder(14,0)}${finder(0,14)}</svg>`;
}

function smooth(pts){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
let gid=0;
function lineChart({w=640,h=240,labels,series,max,ticks,fmt=v=>v,marks=[],vgrid=false}){
  const L=44,R=16,T=26,B=28, iw=w-L-R, ih=h-T-B;
  const x=i=>L+iw*i/(labels.length-1), y=v=>T+ih*(1-v/max);
  let s=`<svg class="tp-chart" viewBox="0 0 ${w} ${h}" role="img">`;
  for(const t of ticks) s+=`<line class="grid" x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`;
  if(vgrid) labels.forEach((_,i)=>s+=`<line class="grid" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T+ih}"/>`);
  labels.forEach((l,i)=>s+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${l}</text>`);
  for(const se of series){
    const pts=se.vals.map((v,i)=>[+x(i).toFixed(1),+y(v).toFixed(1)]); const d=smooth(pts);
    if(se.fill){ const id='g'+(++gid); s+=`<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity=".35"/><stop offset="1" stop-color="${se.color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${pts.at(-1)[0]},${T+ih} L${pts[0][0]},${T+ih} Z" fill="url(#${id})"/>`; }
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linecap="round"/>`;
    if(se.dots) pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`);
  }
  for(const m of marks){
    const px=x(m.i), py=y(series[m.s].vals[m.i]); const tw=m.label.length*6.2+16;
    s+=`<circle cx="${px}" cy="${py}" r="5" fill="${m.color}" stroke="var(--surface)" stroke-width="2"/><rect x="${px-tw/2}" y="${py-32}" width="${tw}" height="20" rx="4" fill="${m.color}"/><path d="M${px-5},${py-12.5} L${px},${py-7} L${px+5},${py-12.5}Z" fill="${m.color}"/><text x="${px}" y="${py-18}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:10.5px">${m.label}</text>`;
  }
  return s+'</svg>';
}
function gauge(val,{w=220,label='',unit='%',max=100,split=.6,c1='var(--accent)',c2='var(--success)'}={}){
  const cx=w/2, cy=w*.52, r=w*.36, sw=w*.075;
  const pt=a=>[cx+r*Math.cos(Math.PI*(1-a)), cy-r*Math.sin(Math.PI*(1-a))];
  const arc=(a0,a1,col)=>{const [x0,y0]=pt(a0),[x1,y1]=pt(a1);return `<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;};
  const f=Math.min(val/max,1), [nx,ny]=[cx+(r-sw*.2)*Math.cos(Math.PI*(1-f)), cy-(r-sw*.2)*Math.sin(Math.PI*(1-f))];
  return `<svg class="tp-chart" viewBox="0 0 ${w} ${w*.72}" style="max-width:${w}px;margin:auto">${arc(0,split,c1)}${arc(split,1,c2)}
  <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--text)" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="8" fill="var(--surface)" stroke="var(--text)" stroke-width="4"/>

}
function pie(a,b,la,lb){

  const [x1,y1]=p(0,r,...off),[x2,y2]=p(ang,r,...off),[x3,y3]=p(ang),[x4,y4]=p(2*Math.PI-0.0001);

  const dev=S.device, pid=S.prof[dev], p=PROFILES[pid];
  let inner;
  if(dev==='web') inner = `<div class="frame frame--web"><div class="tp" data-theme="${S.theme.web}" style="width:1440px;height:900px;position:relative">${p?webShell(p,S.scr.web):webPicker()+toastsHtml()}</div></div>`;
  else inner = `<div class="frame frame--mob"><div class="tp tp-phone" data-theme="${S.theme.mob}">${p?mobShell(p,S.scr.mob):mobPicker()+toastsHtml()}</div></div>`;
  root.innerHTML = presBar() + `<div class="stage">${inner}</div>`;
  if(render.key===keyNow) root.querySelectorAll('.tp-content,.tp-m-body,.tp-drawer__body').forEach(el=>{ if(keep[el.className]!=null) el.scrollTop=keep[el.className]; });
  render.key=keyNow; fit();
}
function fit(){
  const st=root.querySelector('.stage'), f=root.querySelector('.frame'); if(!st||!f) return;
  const t=f.firstElementChild, W=S.device==='web'?1440:410, H=S.device==='web'?900:864;
  const s=Math.min(1,(st.clientWidth)/W);
  t.style.transform=`scale(${s})`; t.style.transformOrigin='top left';
  f.style.width=W*s+'px'; f.style.height=H*s+'px';
  if(S.device==='mob'){ t.style.marginLeft='10px'; t.style.marginTop='10px'; }
}
window.addEventListener('resize', fit);

/* ===== História: avanços encadeados ===== */
function advance(to){
  const order=['opReleased','loadDone','loadSent','shipped','received','routeDone','kitShipped','accepted'];
  const n=order.indexOf(to);
  if(n>=0 && S.ops['OP-3310']==='Pendente') S.ops['OP-3310']='Liberado';
  if(n>=1 && S.load.seq<LOAD_SEQ.length){ while(S.load.seq<LOAD_SEQ.length){ const r=LOAD_SEQ[S.load.seq++]; S.load.reads.push({...r,t:'16:3'+S.load.seq}); } S.load.last=null; }
  if(n>=2 && S.mn0457==='Em Conferência') S.mn0457='Aguardando Aprovação';
  if(n>=3 && S.mn0457==='Aguardando Aprovação') S.mn0457='Em Trânsito';
  if(n===4 || (to==='accepted')){ if(S.mn0457!=='Recebido'){ S.recv.reads=['PC-000201','PC-000202','PC-000203','PC-000204','PC-000205','PC-000206','PC-000207','PC-000208'].map((c,i)=>({c,ok:true,t:'17:'+(35+i),sub:'Guardar em '+GUARD})); S.recv.seq=RECV_SEQ.length; S.mn0457='Recebido'; } }
  if(n>=5){ S.route.idx=KIT142.length; S.k142ready=true; }
  if(n>=6 && S.kits['KT-0142']==='Em Separação'){ S.kits['KT-0142']='Em Trânsito'; S.ship={scanned:true,carrier:S.ship.carrier||'Transporte interno',t:'18:05'}; }
  if(n>=7){ S.accept.got=[0,1,2,3,4]; S.accept.seq=ACC_SEQ.length; S.kits['KT-0142']='Entregue Parcial'; }
}

/* ===== Ações ===== */
function toast(k,m){ const t={id:Math.random(),k,m,dev:S.device}; S.toasts.push(t); setTimeout(()=>{S.toasts=S.toasts.filter(x=>x!==t); render();},3400); }
const now = () => clock();
const A = {
  device:v=>{S.device=v;S.pop=null;},
  pick:v=>{const d=S.device; S.prof[d]=v; S.scr[d]=MENUS[v][0][0]; S.pop=null; S.drawer=false; S.lock=null;},
  swap:()=>{S.prof[S.device]=null; S.pop=null; S.modal=null; S.drawer=false; S.lock=null;},
  go:v=>{S.scr[S.device]=v; S.pop=null; S.drawer=false; S.justSent=false;},
  theme:()=>{S.theme[S.device]=S.theme[S.device]==='light'?'dark':'light';},
  bell:()=>{S.pop=S.pop==='bell'?null:'bell';},
  toast:v=>{const [k,m]=v.split('|'); toast(k,m);},
  hsGo:v=>{const [code,scr]=v.split('|'); S.scr.web=scr; S.pop=null; if(scr==='E-ADM4'){S.trace.q=code; S.trace.mode=code.startsWith('LT')?'Lote':'Código';} if(scr==='T-ADM3'){S.ksel=code;S.drawer=true;} if(scr==='F-ADM2'&&OPS.find(o=>o.id===code)) S.opSel=code;},
  opsTab:v=>{S.tab.ordersTab=v;}, opSel:v=>{S.opSel=v;},
  releaseOp:()=>{S.ops[S.opSel]='Liberado'; toast('ok',`${S.opSel} liberado para etiquetagem. ${S.opSel==='OP-3310'?'Bruno Lima foi avisado no app.':''}`);},
  simSend:()=>{advance('loadSent'); toast('ok','Bruno Lima enviou a conferência da MN-0457 (8/10).');},
  authorize:()=>{S.mn0457='Em Trânsito'; toast('ok','Expedição da MN-0457 autorizada. Status: Em Trânsito.');},
  prio:v=>{const [k,d]=v.split('|'), q=S.queue, i=q.indexOf(k), j=i+(+d); if(j<0||j>=q.length) return; [q[i],q[j]]=[q[j],q[i]]; toast('ok',`${k} agora é o ${j+1}º da fila.`);},
  dispatch:v=>{ if(!S.assignee[v]){toast('bad','Escolha o responsável antes de disparar a coleta.');return;} S.kits[v]='Em Separação'; toast('ok',`Ordem de coleta do ${v} enviada para ${S.assignee[v]}.`);},
  traceMode:v=>{S.trace.mode=v; if(v==='Lote') S.trace.q='LT-2026-088'; if(v==='Código') S.trace.q='PC-000098';},
  trace:v=>{S.trace.q=v; S.trace.mode=v.startsWith('LT')?'Lote':S.trace.mode==='QR Code'?'QR Code':'Código'; if(S.trace.mode==='QR Code') toast('ok','QR lido: '+v);},
  addItem:v=>{const c=CATALOG.find(x=>x[0]===v); S.req.items.push([v,1,c[2]]); S.justSent=false;},
  rmItem:v=>{S.req.items.splice(+v,1);},
  qty:v=>{const [i,d]=v.split('|').map(Number); S.req.items[i][1]=Math.max(1,S.req.items[i][1]+d);},
  reqPrio:v=>{S.req.prio=v;},
  sendReq:()=>{ const id='KT-0'+(146+S.extraKits.length); S.extraKits.push({id,proto:PROTOS[S.req.proto].name,items:S.req.items.map(x=>[...x]),prio:S.req.prio,partial:S.req.partial}); S.kits[id]='Aguardando Separação'; S.queue.push(id); S.assignee[id]=''; S.req.items=[]; S.justSent=true; toast('ok',`${id} enviado ao Estoque.`);},
  kview:v=>{S.kview=v;},
  openKit:v=>{S.ksel=v; S.drawer=true; S.scr.web='T-ADM3';},
  closeDrawer:()=>{S.drawer=false;},
  simRelease:()=>{advance('opReleased'); toast('ok','Carla Mendes liberou a OP-3310.');},
  labelQty:v=>{S.labels.qty=Math.min(10,Math.max(4,(S.labels.qty||10)+(+v)));},
  print:()=>{ S.modal={type:'print',p:0}; const iv=setInterval(()=>{ if(!S.modal||S.modal.type!=='print'){clearInterval(iv);return;} S.modal.p=Math.min(100,S.modal.p+10); if(S.modal.p>=100){clearInterval(iv); S.labels.printed=true;} render(); },220);},
  loadScan:()=>{ const r=LOAD_SEQ[S.load.seq++]; const rec={...r,t:now()}; S.load.reads.push(rec); S.load.last=rec; },
  loadSend:()=>{ S.mn0457='Aguardando Aprovação'; toast('ok','Conferência enviada para Carla Mendes aprovar.');},
  tabM:v=>{S.tab.marcos=v;},
  simArrive:()=>{advance('shipped'); toast('ok','MN-0457 chegou na doca 2.');},
  recvScan:()=>{ const r=RECV_SEQ[S.recv.seq++]; const rec={...r,t:now(),sub:'Guardar em '+GUARD}; S.recv.reads.push(rec); S.recv.last=rec; },
  photo:v=>{ if(v==='recv') S.recv.photo=true; else if(S.modal) S.modal.photo=true; },
  damage:()=>{ if(!S.recv.photo){toast('warn','Tire a foto da peça antes de registrar a avaria.');return;} S.recv.damage=true; toast('ok','Avaria registrada e enviada para Ricardo Alves.');},
  recvDone:()=>{ S.mn0457='Recebido'; toast('ok','MN-0457 recebida. 1 Farol LED reservado para completar o KT-0142.');},
  routeScan:()=>{ const it=KIT142[S.route.idx];
    if(S.route.idx===1&&!S.route.badTried){ S.route.badTried=true; S.route.last={c:'PC-000412',ok:false,msg:'Peça não pertence a este kit'}; return; }
    S.route.last={c:it.code,ok:true}; S.route.idx++; toast('ok',`${it.p} ×${it.q} coletado.`);},
  routeMiss:()=>{S.modal={type:'partial'};},
  partialYes:()=>{ S.modal=null; S.route.idx=KIT142.length; S.k142ready=true; S.tab.marcos='Kits para Despacho'; toast('ok','KT-0142 pronto para despacho (parcial).');},
  partialNo:()=>{ S.modal=null; toast('warn','Coleta pausada até o Farol LED esquerdo chegar.');},
  showLock:()=>{S.lock='KT-0139';}, unlock:()=>{S.lock=null; S.scr.mob='E-FUNC1'; S.tab.marcos='Montagem de Kits';},
  shipScan:()=>{S.ship.scanned=true; S.ship.t=now(); toast('ok','Caixa CX-KT-0142 confirmada.');},
  carrier:v=>{S.ship.carrier=v;},
  shipConfirm:()=>{ S.kits['KT-0142']='Em Trânsito'; toast('ok','KT-0142 expedido para a oficina de protótipos.');},
  simKitArrive:()=>{advance('kitShipped'); toast('ok','KT-0142 chegou na oficina.');},
  accScan:()=>{ const r=ACC_SEQ[S.accept.seq++], it=KIT142[r.i]; const rec={c:it.code,ok:r.ok,msg:r.msg}; S.accept.last=rec; if(r.ok&&!S.accept.got.includes(r.i)) S.accept.got.push(r.i); },
  report:()=>{S.modal={type:'report'};},
  reportSend:()=>{ S.modal=null; S.accept.reported=true; toast('ok','Relato enviado ao Estoque com foto.');},
  accept:()=>{ S.kits['KT-0142']='Entregue Parcial'; toast('ok','KT-0142 aceito. SUV X liberado para montagem.');},
  modalClose:()=>{S.modal=null;},
  skipEnd:()=>{ advance('opReleased'); S.labels.printed=true; advance('loadSent'); advance('shipped'); advance('received'); advance('accepted'); S.kits['KT-0145']='Em Separação'; S.assignee['KT-0145']='Marcos Souza'; toast('ok','Demo no fim da história: KT-0142 entregue parcial.');},
  reset:()=>{ const dev=S.device; S=fresh(); S.device=dev; toast('ok','Demo reiniciada.');}
};
root.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  if(el.tagName==='INPUT'||el.tagName==='SELECT') return;
  if(el.dataset.a==='bell'&&el.tagName==='DIV'){ S.pop=null; render(); return; }
  e.preventDefault();
  const f=A[el.dataset.a]; if(!f) return; f(el.dataset.v, el); render();
});
root.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.bind){ const [o,k]=el.dataset.bind.split('.'); S[o][k]=el.value; render(); return; }
  const a=el.dataset.a;
  if(a==='assign'){ S.assignee[el.dataset.v]=el.value; if(el.value) toast('ok',`${el.dataset.v} atribuído a ${el.value}.`); render(); }
  if(a==='toggleB'){ S.req.items[+el.dataset.v][2]=el.checked; render(); }
  if(a==='partial'){ S.req.partial=el.checked; render(); }
});
root.addEventListener('input', e=>{
  if(e.target.dataset.live==='catalog'){ S.req.q=e.target.value; const box=root.querySelector('#catalog-results'); if(box) box.innerHTML=catalogResults(); }
});
root.addEventListener('submit', e=>{
  e.preventDefault(); const f=e.target.dataset.form;
  if(f==='hsearch'){ S.hsq=root.querySelector('#hs-q').value; S.pop='search'; }
  if(f==='trace'){ S.trace.q=root.querySelector('#trace-q').value; }
  if(f==='map'){ const m=S.map, part=root.querySelector('#m-p').value; toast('ok',`Endereço ${m.c}-${m.s}-${m.n}-${m.b} salvo para ${part}.`); }
  render();
});
render();

</script>

</body></html>
